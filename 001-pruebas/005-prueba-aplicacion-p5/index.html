<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sketch p5.js</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="libraries/p5.js"></script>
</head>
<body>
  <svg style="position: absolute; width: 0; height: 0;">
    <filter id="filtro-pelo">
      <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="3" seed="7" result="ruido" />
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="60" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <main id="sketch-holder"></main>
  <script src="js/sketch.js"></script>
</body>
</html>
